name: Publish Open-Tic

on:
  repository_dispatch:
    types: [new-build, new-build-win]
  workflow_dispatch:
    inputs:
      platform:
        description: "android or windows"
        required: true
        default: android
      tag:
        description: "Build tag to publish (empty = newest build)"
        required: false

permissions:
  contents: write

jobs:
  android:
    if: github.event.action == 'new-build' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'android')
    runs-on: ubuntu-latest
    steps:
      - name: Get APKs
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SRC: ${{ secrets.SOURCE_REPO }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          mkdir dist
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$SRC" -p "*.apk" -D dist
          else
            gh release download -R "$SRC" -p "*.apk" -D dist
          fi
          ls dist
          V=$(ls dist | head -1 | sed -E 's/^Open-Tic-([0-9.]+)-.*/\1/')
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="Open-Tic $VERSION برای اندروید.
          برای بیشتر گوشی‌ها فایل arm64-v8a را بردارید؛ اگر نصب نشد، فایل universal را."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.apk -R "$GITHUB_REPOSITORY" --title "Open-Tic $VERSION" --notes "$NOTES" --latest
          fi

  windows:
    if: github.event.action == 'new-build-win' || (github.event_name == 'workflow_dispatch' && inputs.platform == 'windows')
    runs-on: ubuntu-latest
    steps:
      - name: Get Open-Tic.exe
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SRC: ${{ secrets.SOURCE_REPO_WIN }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          VER: ${{ github.event.client_payload.version }}
        run: |
          mkdir dl dist
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$SRC" -p "Open-Tic.exe" -D dl
          else
            gh release download -R "$SRC" -p "Open-Tic.exe" -D dl
            TAG=$(gh release list -R "$SRC" -L 1 --json tagName -q '.[0].tagName')
          fi
          if [ -z "$VER" ]; then
            VER=$(gh release view "$TAG" -R "$SRC" --json name -q .name | sed -E 's/.*Windows ([0-9.]+).*/\1/')
          fi
          case "$VER" in ''|*[!0-9.]*) echo "bad version: $VER"; exit 1;; esac
          F="Open-Tic-$VER-windows-x64.exe"
          mv dl/Open-Tic.exe "dist/$F"
          ( cd dist && sha256sum "$F" > "$F.sha256" )
          ls -la dist
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="win-v$VERSION"
          NOTES="Open-Tic $VERSION برای ویندوز (۶۴ بیتی).
          فایل exe را دانلود و اجرا کنید؛ ویندوز یک بار اجازه‌ی Administrator می‌خواهد (برای ساخت تونل سیستمی)."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            # --latest=false: the "latest" badge stays on the Android release
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "Open-Tic Windows $VERSION" --notes "$NOTES" --latest=false
          fi
